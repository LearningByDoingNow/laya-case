name: Refresh Data

on:
  schedule:
    # Re-collect every source on Mondays at 03:00 UTC (11:00 Beijing time)
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch latest data from all sources
        # One failing source (Reddit 429, endpoint blip) must not block the
        # refresh: healthy sources still update and writeAuto keeps the failed
        # source's file untouched.
        run: |
          npm run data:fetch || \
            echo "::warning::some sources failed; committing partial refresh"

      - name: Rebuild merged data (offline, deterministic)
        run: npm run data:build

      - name: Guard against publishing truncated data
        # Abort when the collector fails broadly so truncated data never ships.
        run: |
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/data/cases.json','utf8')).cases.length)")
          echo "merged case count: $COUNT"
          if [ "$COUNT" -lt 60 ]; then
            echo "::error::case count $COUNT is below 60; refusing to publish truncated data"
            exit 1
          fi

      - name: Commit refreshed data
        id: commit
        run: |
          if git diff --quiet -- src/data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "chore: refresh collected data (automated)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger CI build and deploy
        # A push made with GITHUB_TOKEN never starts other workflows, so trigger
        # CI explicitly to rebuild and deploy.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI --ref main
