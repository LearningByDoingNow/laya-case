name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild merged data (offline, deterministic)
        run: npm run data:build
      - name: Type check
        run: npm run check
      - name: Build static site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://learningbydoingnow.github.io
      - name: Upload Pages artifact
        # Only deploy builds of main. Checking the ref (not the event name)
        # keeps pull requests out while still letting the refresh workflow's
        # workflow_dispatch runs deploy the newly collected data.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
